        <div class="bg-dark-card/90 border-b border-dark-border px-4 py-3 flex items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <img id="modal-game-icon" src="" alt="" class="w-8 h-8 rounded-lg object-cover border border-dark-border">
                <div>
                    <h3 id="modal-game-title" class="font-bold text-slate-100 text-sm md:text-base leading-tight">Game Title</h3>
                    <span id="modal-game-category" class="text-xs text-brand-500 font-semibold uppercase tracking-wider">Category</span>
                </div>
            </div>

            <!-- Controls -->
            <div class="flex items-center gap-2">
                <button id="reload-btn" title="Reload Game" class="p-2.5 rounded-lg bg-dark-bg border border-dark-border hover:bg-slate-700 text-slate-300 hover:text-white transition-colors">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
                <button id="fullscreen-btn" title="Fullscreen Mode" class="p-2.5 rounded-lg bg-dark-bg border border-dark-border hover:bg-slate-700 text-slate-300 hover:text-white transition-colors">
                    <i class="fa-solid fa-expand"></i>
                </button>
                <button id="close-modal-btn" title="Close Game" class="p-2.5 rounded-lg bg-red-500/20 border border-red-500/30 text-red-400 hover:bg-red-500 hover:text-white transition-colors">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
        </div>

        <!-- Frame Container -->
        <div class="flex-grow relative bg-black flex items-center justify-center overflow-hidden">
            <!-- Loading Indicator -->
            <div id="iframe-loader" class="absolute inset-0 flex flex-col items-center justify-center bg-dark-bg gap-3">
                <div class="w-10 h-10 border-4 border-brand-500/20 border-t-brand-500 rounded-full animate-spin"></div>
                <p class="text-xs text-slate-400 font-medium">Loading Game Canvas...</p>
            </div>

            <!-- Game Iframe -->
            <iframe id="game-iframe" class="w-full h-full border-0 relative z-10" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true" scrolling="no"></iframe>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // Set dynamic copyright year
        document.getElementById('year').textContent = new Date().getFullYear();

        /**
         * JSON DATASET SIMULATION
         * Represents unblocked playable web games stored as iframe URLs
         */
        const MOCK_GAMES_JSON = JSON.stringify([
            {
                id: "2048",
                title: "2048",
                category: "Puzzle",
                thumbnail: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=400&q=80",
                iframeSrc: "https://play2048.co/",
                tags: ["classic", "numbers", "brain", "popular"]
            },
            {
                id: "hextris",
                title: "Hextris",
                category: "Arcade",
                thumbnail: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=400&q=80",
                iframeSrc: "https://hextris.io/",
                tags: ["tetris", "fast", "colors", "action"]
            },
            {
                id: "pacman",
                title: "Pac-Man Canvas",
                category: "Retro",
                thumbnail: "https://images.unsplash.com/photo-1579373903781-fd5c0c30c4cd?auto=format&fit=crop&w=400&q=80",
                iframeSrc: "https://pacman.com/en/",
                tags: ["arcade", "classic", "80s", "ghosts"]
            },
            {
                id: "slope",
                title: "3D Ball Runner",
                category: "Action",
                thumbnail: "https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=400&q=80",
                iframeSrc: "https://html5.gamedistribution.com/rvvASm12613d42128e46e8c7ad4ecf8d/",
                tags: ["3d", "speed", "endless", "ball"]
            },
            {
                id: "chess",
                title: "Master Chess",
                category: "Strategy",
                thumbnail: "https://images.unsplash.com/photo-1529699211952-734e80c4d42b?auto=format&fit=crop&w=400&q=80",
                iframeSrc: "https://html5.gamedistribution.com/62c93845b59740529d380bbfbe5c6f6e/",
                tags: ["board", "logic", "2player", "mind"]
            },
            {
                id: "drift-boss",
                title: "Drift Rally",
                category: "Driving",
                thumbnail: "https://images.unsplash.com/photo-1568605117036-5fe5e7bab0b7?auto=format&fit=crop&w=400&q=80",
                iframeSrc: "https://html5.gamedistribution.com/b39a7776b2e14a1a9e1e2d7e0129bcff/",
                tags: ["car", "racing", "drift", "speed"]
            },
            {
                id: "snake",
                title: "Retro Snake",
                category: "Retro",
                thumbnail: "https://images.unsplash.com/photo-1628277613967-6abca504d0ac?auto=format&fit=crop&w=400&q=80",
                iframeSrc: "https://playsnake.org/",
                tags: ["classic", "arcade", "retro", "easy"]
            },
            {
                id: "flappy-bird",
                title: "Flappy Plane",
                category: "Arcade",
                thumbnail: "https://images.unsplash.com/photo-1508614589041-895b88991e3e?auto=format&fit=crop&w=400&q=80",
                iframeSrc: "https://flappybird.io/",
                tags: ["tap", "hard", "flying", "bird"]
            }
        ]);

        // Application State
        let gamesData = [];
        let activeCategory = "All";
        let searchQuery = "";

        // DOM Elements
        const gamesGrid = document.getElementById('games-grid');
        const categoryContainer = document.getElementById('category-container');
        const searchInput = document.getElementById('search-input');
        const clearSearchBtn = document.getElementById('clear-search');
        const gameCountBadge = document.getElementById('game-count');
        const visibleCountSpan = document.getElementById('visible-count');
        const sectionTitle = document.getElementById('section-title');
        const noResultsDiv = document.getElementById('no-results');
        const resetFiltersBtn = document.getElementById('reset-filters');

        // Modal DOM Elements
        const gameModal = document.getElementById('game-modal');
        const gameIframe = document.getElementById('game-iframe');
        const iframeLoader = document.getElementById('iframe-loader');
        const modalGameTitle = document.getElementById('modal-game-title');
        const modalGameCategory = document.getElementById('modal-game-category');
        const modalGameIcon = document.getElementById('modal-game-icon');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const reloadBtn = document.getElementById('reload-btn');

        // Initialize App
        function initApp() {
            // Load and parse simulated JSON
            try {
                gamesData = JSON.parse(MOCK_GAMES_JSON);
            } catch (err) {
                console.error("Error loading games JSON:", err);
                gamesData = [];
            }

            // Update stats
            gameCountBadge.textContent = `${gamesData.length} Games`;

            // Extract Categories
            const categories = ["All", ...new Set(gamesData.map(g => g.category))];

            // Render Category Filter Buttons
            renderCategoryButtons(categories);

            // Render Initial Games
            filterAndRenderGames();

            // Event Listeners
            setupEventListeners();
        }

        // Render Category Filter Buttons
        function renderCategoryButtons(categories) {
            categoryContainer.innerHTML = categories.map(cat => `
                <button 
                    data-category="${cat}"
                    class="category-btn whitespace-nowrap px-4 py-2 rounded-xl text-xs font-semibold border transition-all ${
                        cat === activeCategory 
                        ? 'bg-brand-600 border-brand-500 text-white shadow-lg shadow-brand-600/25' 
                        : 'bg-dark-card border-dark-border text-slate-300 hover:border-slate-600 hover:text-white'
                    }"
                >
                    ${getCategoryIcon(cat)} ${cat}
                </button>
            `).join('');
        }

        // Helper icon for categories
        function getCategoryIcon(cat) {
            switch(cat) {
                case 'All': return '<i class="fa-solid fa-border-all mr-1.5"></i>';
                case 'Puzzle': return '<i class="fa-solid fa-puzzle-piece mr-1.5"></i>';
                case 'Arcade': return '<i class="fa-solid fa-gamepad mr-1.5"></i>';
                case 'Action': return '<i class="fa-solid fa-bolt mr-1.5"></i>';
                case 'Driving': return '<i class="fa-solid fa-car mr-1.5"></i>';
                case 'Strategy': return '<i class="fa-solid fa-chess mr-1.5"></i>';
                case 'Retro': return '<i class="fa-solid fa-ghost mr-1.5"></i>';
                default: return '<i class="fa-solid fa-cubes mr-1.5"></i>';
            }
        }

        // Filter & Render Games
        function filterAndRenderGames() {
            const query = searchQuery.toLowerCase().trim();

            const filtered = gamesData.filter(game => {
                const matchesCategory = activeCategory === 'All' || game.category === activeCategory;
                const matchesTitle = game.title.toLowerCase().includes(query);
                const matchesTag = game.tags && game.tags.some(tag => tag.toLowerCase().includes(query));

                return matchesCategory && (matchesTitle || matchesTag);
            });

            // Update visible stats
            visibleCountSpan.textContent = filtered.length;
            sectionTitle.innerHTML = activeCategory === 'All' 
                ? '<span>All Games</span>' 
                : `<span>Category: <span class="text-brand-500">${activeCategory}</span></span>`;

            // Toggle No Results
            if (filtered.length === 0) {
                gamesGrid.innerHTML = '';
                noResultsDiv.classList.remove('hidden');
                noResultsDiv.classList.add('flex');
            } else {
                noResultsDiv.classList.add('hidden');
                noResultsDiv.classList.remove('flex');
                
                // Render Cards
                gamesGrid.innerHTML = filtered.map(game => `
                    <div 
                        onclick="launchGame('${game.id}')"
                        class="game-card group cursor-pointer bg-dark-card border border-dark-border hover:border-brand-500/50 rounded-2xl overflow-hidden flex flex-col justify-between shadow-lg"
                    >
                        <div class="relative aspect-video w-full overflow-hidden bg-slate-900">
                            <img 
                                src="${game.thumbnail}" 
                                alt="${game.title}"
                                class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-300"
                                loading="lazy"
                                onerror="this.src='https://placehold.co/400x225/1e293b/94a3b8?text=Arcade+Game'"
                            />
                            <div class="absolute inset-0 bg-gradient-to-t from-dark-card via-transparent to-transparent opacity-60"></div>
                            
                            <!-- Play Overlay Button -->
                            <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 bg-slate-950/40 backdrop-blur-[2px] transition-opacity">
                                <span class="w-12 h-12 rounded-full bg-brand-500 text-white flex items-center justify-center shadow-lg shadow-brand-500/40 transform scale-75 group-hover:scale-100 transition-transform">
                                    <i class="fa-solid fa-play ml-0.5 text-lg"></i>
                                </span>
                            </div>

                            <span class="absolute top-2.5 left-2.5 px-2 py-0.5 rounded-md text-[10px] font-bold uppercase tracking-wider bg-slate-900/80 backdrop-blur-md text-brand-500 border border-brand-500/20">
                                ${game.category}
                            </span>
                        </div>

                        <div class="p-3.5 flex flex-col justify-between flex-grow">
                            <h3 class="font-bold text-slate-100 text-sm group-hover:text-brand-500 transition-colors line-clamp-1 mb-2">
                                ${game.title}
                            </h3>
                            <div class="flex flex-wrap gap-1">
                                ${game.tags.slice(0, 2).map(tag => `
                                    <span class="text-[10px] bg-slate-800 text-slate-400 px-1.5 py-0.5 rounded border border-slate-700/50">#${tag}</span>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `).join('');
            }
        }

        // Setup Event Listeners
        function setupEventListeners() {
            // Category Buttons Click
            categoryContainer.addEventListener('click', (e) => {
                const btn = e.target.closest('.category-btn');
                if (!btn) return;

                activeCategory = btn.dataset.category;

                // Update Category Styling
                document.querySelectorAll('.category-btn').forEach(b => {
                    b.classList.remove('bg-brand-600', 'border-brand-500', 'text-white', 'shadow-lg', 'shadow-brand-600/25');
                    b.classList.add('bg-dark-card', 'border-dark-border', 'text-slate-300');
                });
                btn.classList.remove('bg-dark-card', 'border-dark-border', 'text-slate-300');
                btn.classList.add('bg-brand-600', 'border-brand-500', 'text-white', 'shadow-lg', 'shadow-brand-600/25');

                filterAndRenderGames();
            });

            // Search Input Event
            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value;
                clearSearchBtn.classList.toggle('hidden', searchQuery.length === 0);
                filterAndRenderGames();
            });

            // Clear Search
            clearSearchBtn.addEventListener('click', () => {
                searchInput.value = '';
                searchQuery = '';
                clearSearchBtn.classList.add('hidden');
                filterAndRenderGames();
            });

            // Reset Filter Button
            resetFiltersBtn.addEventListener('click', () => {
                activeCategory = 'All';
                searchQuery = '';
                searchInput.value = '';
                clearSearchBtn.classList.add('hidden');
                
                const allCategoriesBtn = categoryContainer.querySelector('[data-category="All"]');
                if (allCategoriesBtn) allCategoriesBtn.click();
            });

            // Close Modal Events
            closeModalBtn.addEventListener('click', closeGameModal);
            
            // Fullscreen Event
            fullscreenBtn.addEventListener('click', toggleFullscreen);

            // Reload Game Frame
            reloadBtn.addEventListener('click', () => {
                if (gameIframe.src) {
                    iframeLoader.classList.remove('hidden');
                    gameIframe.src = gameIframe.src;
                }
            });

            // Hide Loader on Iframe Load
            gameIframe.addEventListener('load', () => {
                iframeLoader.classList.add('hidden');
            });

            // Escape Key Listener for Modal
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && !gameModal.classList.contains('hidden')) {
                    closeGameModal();
                }
            });
        }

        // Launch Game in Iframe Modal
        window.launchGame = function(id) {
            const game = gamesData.find(g => g.id === id);
            if (!game) return;

            modalGameTitle.textContent = game.title;
            modalGameCategory.textContent = game.category;
            modalGameIcon.src = game.thumbnail;

            // Show Loader and Load Source
            iframeLoader.classList.remove('hidden');
            gameIframe.src = game.iframeSrc;

            // Display Modal with Fade-In
            gameModal.classList.remove('hidden');
            gameModal.classList.add('flex');
            setTimeout(() => {
                gameModal.classList.remove('opacity-0');
                gameModal.classList.add('opacity-100');
            }, 10);

            // Prevent background scrolling
            document.body.style.overflow = 'hidden';
        };

        // Close Game Modal
        function closeGameModal() {
            gameModal.classList.remove('opacity-100');
            gameModal.classList.add('opacity-0');
            
            setTimeout(() => {
                gameModal.classList.add('hidden');
                gameModal.classList.remove('flex');
                gameIframe.src = 'about:blank'; // Clear iframe memory
                document.body.style.overflow = 'auto';
            }, 300);
        }

        // Toggle Fullscreen Mode
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                gameModal.requestFullscreen().catch(err => {
                    console.error(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        }

        // Run application
        window.addEventListener('DOMContentLoaded', initApp);
    </script>

</body></html>
